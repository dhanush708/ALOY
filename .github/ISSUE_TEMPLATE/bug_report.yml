name: "🐛 Bug Report"
description: Report a bug or unexpected behavior in ALOY
labels: ["bug", "needs-triage"]
assignees: ["dhanush708"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill in as much detail as possible to help us reproduce and fix the issue.

  - type: checkboxes
    id: existing_issue
    attributes:
      label: "Checklist"
      options:
        - label: "I have searched existing issues and this is not a duplicate."
          required: true
        - label: "I am using the latest version of ALOY."
          required: false

  - type: input
    id: aloy_version
    attributes:
      label: "ALOY Version"
      description: "Found in the About panel inside ALOY"
      placeholder: "e.g., 1.0.0"
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: "Operating System"
      placeholder: "e.g., Windows 11 22H2"
    validations:
      required: true

  - type: input
    id: ollama_version
    attributes:
      label: "Ollama Version"
      description: "Run `ollama --version` in your terminal"
      placeholder: "e.g., 0.3.12"
    validations:
      required: false

  - type: input
    id: gpu
    attributes:
      label: "GPU and VRAM"
      placeholder: "e.g., NVIDIA RTX 3060 12GB, or CPU-only"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "What happened? What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Provide the exact steps to reproduce the behavior."
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      placeholder: "What should have happened?"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots or Logs"
      description: "If applicable, add screenshots or paste any relevant error messages."
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
      description: "Any other information that may help."
    validations:
      required: false
