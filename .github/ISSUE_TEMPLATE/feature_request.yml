name: "💡 Feature Request"
description: Suggest a new feature or improvement for ALOY
labels: ["enhancement", "feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that would make ALOY better? We'd love to hear it!

  - type: checkboxes
    id: existing_request
    attributes:
      label: "Checklist"
      options:
        - label: "I have searched existing issues and this request is not a duplicate."
          required: true

  - type: dropdown
    id: category
    attributes:
      label: "Feature Category"
      options:
        - "Conversation & Chat"
        - "Memory System"
        - "Agent Grid"
        - "Knowledge & Web Search"
        - "Tool System"
        - "User Interface"
        - "Performance"
        - "Installation & Setup"
        - "Model Support"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Motivation"
      description: "What problem does this feature solve? What is the current limitation?"
      placeholder: "Currently, ALOY doesn't support..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the feature you'd like to see."
      placeholder: "It would be great if ALOY could..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Are there any workarounds or alternative approaches you've tried?"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
      description: "Any mockups, examples, or references?"
    validations:
      required: false
